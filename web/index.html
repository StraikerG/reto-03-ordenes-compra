<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de órdenes de compra</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --mute:#667085; --line:#e3e7ee; --accent:#2457d6;
          --ok:#127a4a; --err:#b42318; --warn:#b54708; --warnbg:#fff4e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --ink:#e8ecf2; --mute:#97a1b0; --line:#2a323d; --accent:#6f95f5;
            --ok:#4ccf93; --err:#ff8a7e; --warn:#f6b04d; --warnbg:#3a2c12; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header small { color:var(--mute); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:min(760px,100%); padding:10px 14px; border-radius:12px; background:var(--card); border:1px solid var(--line); white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border-color:var(--accent); }
  .bot { align-self:flex-start; }
  .tools { align-self:flex-start; max-width:min(760px,100%); display:flex; flex-direction:column; gap:4px; }
  details { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px 10px; font-size:13px; }
  details summary { cursor:pointer; color:var(--mute); }
  details.ok summary::before { content:"✓ "; color:var(--ok); }
  details.err summary::before { content:"✗ "; color:var(--err); }
  details pre { margin:6px 0; overflow-x:auto; font-size:12px; }
  .confirm { align-self:flex-start; max-width:min(760px,100%); border:2px solid var(--warn); background:var(--warnbg); border-radius:12px; padding:10px 14px; }
  .confirm strong { color:var(--warn); }
  .confirm button { margin-top:8px; margin-right:8px; }
  .thinking { color:var(--mute); font-style:italic; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--card); }
  input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; min-width:0; }
  button { padding:9px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.sec { background:transparent; color:var(--ink); border-color:var(--line); }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>Órdenes de compra · SAP simulado</h1>
  <small id="estado">conectando…</small>
</header>
<div id="log" role="log" aria-live="polite"></div>
<form id="f">
  <input id="t" autocomplete="off" maxlength="2000" placeholder='Ej.: Procesa la solicitud sol-001' aria-label="Mensaje">
  <button id="b">Enviar</button>
</form>
<script>
const log = document.getElementById("log"), f = document.getElementById("f"), t = document.getElementById("t"), b = document.getElementById("b")
const gen = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)).replace(/[^A-Za-z0-9_-]/g, "")
let sessionId = gen()
try { sessionId = sessionStorage.getItem("sid") || sessionId; sessionStorage.setItem("sid", sessionId) } catch {}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e }
function add(node) { log.appendChild(node); log.scrollTop = log.scrollHeight; return node }

function toolCard(c) {
  const d = el("details", c.ok ? "ok" : "err")
  d.appendChild(el("summary", "", `${c.name}(${Object.entries(c.args || {}).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ")}) — ${c.resumen}`))
  d.appendChild(el("pre", "", JSON.stringify(c.args, null, 2)))
  return d
}

function send(text) {
  add(el("div", "msg user", text))
  const wait = add(el("div", "msg bot thinking", "Pensando…"))
  b.disabled = true
  fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ sessionId, message: text }) })
    .then(r => r.json().then(j => ({ status: r.status, j })))
    .then(({ status, j }) => {
      wait.remove()
      if (!j.ok) { add(el("div", "msg bot", "⚠️ " + (j.error || "Error " + status))); return }
      if (j.toolCalls.length) { const w = el("div", "tools"); j.toolCalls.forEach(c => w.appendChild(toolCard(c))); add(w) }
      add(el("div", "msg bot", j.reply))
      if (j.needsConfirmation) {
        const box = el("div", "confirm")
        const st = el("strong", "", "Se necesita tu confirmación")
        box.appendChild(st)
        box.appendChild(el("div", "", "Casos en espera: " + (j.casosPendientes || []).join(", ")))
        const yes = el("button", "", "Sí, confirmo"), no = el("button", "sec", "No, cancelar")
        yes.onclick = () => { box.remove(); send("Sí, confirmo. Crea la OC con esas excepciones.") }
        no.onclick = () => { box.remove(); send("No, no la crees por ahora.") }
        box.appendChild(yes); box.appendChild(no); add(box)
      }
    })
    .catch(() => { wait.remove(); add(el("div", "msg bot", "⚠️ No se pudo contactar al servidor. Intenta de nuevo.")) })
    .finally(() => { b.disabled = false; t.focus() })
}

f.addEventListener("submit", e => { e.preventDefault(); const v = t.value.trim(); if (!v) return; t.value = ""; send(v) })
fetch("/api/health").then(r => r.json()).then(h => {
  document.getElementById("estado").textContent = h.configured ? `${h.provider} · ${h.model}` : "modelo sin configurar (falta la clave)"
}).catch(() => { document.getElementById("estado").textContent = "sin conexión" })
add(el("div", "msg bot", 'Hola. Dime qué caso procesar, por ejemplo: "Procesa la solicitud sol-001". Los casos disponibles son sol-001 a sol-006. No creo ninguna OC con excepciones sin tu confirmación.'))
</script>
</body>
</html>
